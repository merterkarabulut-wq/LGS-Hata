<title>Duru'nun Çalışma Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
/*
  TASARIM PLANI
  Konu: LGS'ye hazırlanan 8. sınıf öğrencisinin çalışma masası.
  Kimlik: "optik form + ders defteri". Serin mavimsi kâğıt zemin, lacivert mürekkep metin,
  mürekkep mavisi vurgu. Şıklar optik formdaki gibi somon çizgili yuvarlak baloncuklar
  (seçilince dolar). Tüyolar fosforlu kalem sarısı. Her dersin bir renk etiketi var.
  Çekirdek renkler: --bg, --surface, --fg, --accent, --hl, --bubble. Gerisi bunlardan türeyen
  yardımcı tonlar (çizgi, soluk metin, doğru/yanlış, ders etiketleri).
  Fontlar: başlık Bricolage Grotesque, gövde Atkinson Hyperlegible.
*/
:root{
  --bg:#f2f6fc; --surface:#ffffff; --fg:#12203f; --accent:#2343b5; --hl:#fff27a; --bubble:#d9645a;
  --surface2:#e8eef9; --muted:#4f5d7a; --line:#cdd7ea; --on-accent:#ffffff;
  --ok:#17734a; --ok-bg:#dff3e8; --bad:#b0281f; --bad-bg:#fbe3e0;
  --c-tr:#b4441f; --c-mat:#2b5fc4; --c-fen:#1f8a5b; --c-ink:#8a5a12; --c-din:#6c4bb0; --c-ing:#b0307a; --c-diger:#5b6784;
  --f-baslik:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-govde:"Atkinson Hyperlegible","Segoe UI",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1526; --surface:#162038; --fg:#e8edf9; --accent:#8cabff; --hl:rgba(255,226,60,.3); --bubble:#f08c82;
    --surface2:#1f2b49; --muted:#a3afcb; --line:#2f3d62; --on-accent:#0e1526;
    --ok:#6fd6a0; --ok-bg:#12382a; --bad:#ff9d94; --bad-bg:#401c1a;
    --c-tr:#ff9a70; --c-mat:#8cb1ff; --c-fen:#5fd39b; --c-ink:#e0b45e; --c-din:#b9a0f5; --c-ing:#f08cc0; --c-diger:#a3afcb;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1526; --surface:#162038; --fg:#e8edf9; --accent:#8cabff; --hl:rgba(255,226,60,.3); --bubble:#f08c82;
  --surface2:#1f2b49; --muted:#a3afcb; --line:#2f3d62; --on-accent:#0e1526;
  --ok:#6fd6a0; --ok-bg:#12382a; --bad:#ff9d94; --bad-bg:#401c1a;
  --c-tr:#ff9a70; --c-mat:#8cb1ff; --c-fen:#5fd39b; --c-ink:#e0b45e; --c-din:#b9a0f5; --c-ing:#f08cc0; --c-diger:#a3afcb;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-govde);font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-baslik);font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
h1{font-size:clamp(1.7rem,6vw,2.4rem)} h2{font-size:1.3rem} h3{font-size:1.08rem} h4{font-size:1rem}
p{margin:0 0 .6em} a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kabuk{min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.ic{max-width:940px;margin:0 auto}
.metin{white-space:pre-line;overflow-wrap:anywhere}
.soluk-yazi{color:var(--muted)}
.kucuk{font-size:.88rem}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* üst şerit */
.ust{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:18px}
.marka{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--f-baslik);font-weight:700;font-size:1.05rem}
.marka-bal{display:inline-flex;gap:3px}
.marka-bal i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bubble);display:block}
.marka-bal i:nth-child(2){background:var(--accent);border-color:var(--accent)}
.ana-sekme{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.ana-sekme a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--fg);font-weight:700;font-size:.92rem}
.ana-sekme a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

/* bildirim */
.bildirim{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:14px;border:1.5px solid var(--line);background:var(--surface)}
.bildirim.ok{border-color:var(--ok);background:var(--ok-bg)} .bildirim.hata{border-color:var(--bad);background:var(--bad-bg)}
.bildirim button{background:none;border:0;cursor:pointer;font-size:1.2rem;line-height:1;padding:2px 6px;color:var(--fg)}

/* kahraman ve sayaçlar */
.kahraman{margin-bottom:22px}
.kahraman h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 4px;margin:0 -4px}
.karolar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.karo{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px}
.karo b{display:block;font-family:var(--f-baslik);font-size:1.9rem;line-height:1.1}
.karo span{font-size:.88rem;color:var(--muted)}

.bolum{margin-top:28px}
.bolum>h2{margin-bottom:10px}
.bos-durum{border:2px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.bos-durum strong{display:block;color:var(--fg);font-family:var(--f-baslik);font-size:1.1rem;margin-bottom:4px}
.iskelet{display:grid;gap:10px;margin-top:10px}
.iskelet i{display:block;height:84px;border-radius:12px;background:var(--surface2);animation:nefes 1.4s ease-in-out infinite}
@keyframes nefes{50%{opacity:.5}}

/* ders etiketleri */
.d-tr{--c:var(--c-tr)} .d-mat{--c:var(--c-mat)} .d-fen{--c:var(--c-fen)} .d-ink{--c:var(--c-ink)} .d-din{--c:var(--c-din)} .d-ing{--c:var(--c-ing)} .d-diger{--c:var(--c-diger)}
.ders-chip{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 50%,var(--line))}
.ders-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.ders-baslik{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding-left:10px;border-left:6px solid var(--c)}
.ders-izgara{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.ders-izgara{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ders-izgara .bos-yer{visibility:hidden}
.ders-kart{display:flex;flex-direction:column;gap:6px;height:100%;min-height:110px;box-sizing:border-box;text-decoration:none;color:var(--fg);background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:4px 14px 14px 4px;padding:14px 16px}
.ders-kart:hover{border-color:var(--c);box-shadow:0 3px 0 -1px color-mix(in srgb,var(--c) 40%,transparent)}
.ders-kart h3{font-size:1.15rem}
.ders-ust{display:block;width:100%;box-sizing:border-box;background:var(--c);border:2px solid var(--c);border-radius:14px;padding:14px 20px;margin:6px 0 16px;box-shadow:0 3px 0 -1px color-mix(in srgb,var(--c) 45%,transparent)}
.ders-ust h2{margin:0;color:var(--surface);font-size:1.6rem;font-weight:800;letter-spacing:.01em}
.konu-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.konu-kart{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:4px 14px 14px 4px;padding:12px 14px;min-width:0}
.konu-kart:hover{border-color:var(--c);box-shadow:0 3px 0 -1px color-mix(in srgb,var(--c) 40%,transparent)}
.konu-kart.soluk{opacity:.62}
.konu-kart h3{font-size:1.05rem}
.unite-no{margin-right:8px;font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.konu-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;color:var(--muted)}
.ilerleme{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.ilerleme i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rozet{display:inline-block;align-self:flex-start;padding:1px 10px;border-radius:6px;font-size:.78rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface2)}
.rozet.tekrar{background:var(--hl);border-color:transparent;color:var(--fg)}
.rozet.tamam{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.rozet.calisiyor{border-color:var(--accent);color:var(--accent);background:transparent}

/* ödev kartı */
.odev{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.odev>div{min-width:0;flex:1 1 220px}
.not-kutu{background:var(--hl);padding:6px 10px;border-radius:6px;margin-top:6px;font-size:.92rem}

/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ikincil{background:transparent;color:var(--accent)}
.btn.tehlike{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.kucuk{min-height:36px;padding:4px 12px;font-size:.9rem}
.satir{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* banner */
.serit{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;background:var(--hl);border-radius:10px;padding:10px 14px;margin-bottom:16px}

/* konu sayfası */
.geri{display:inline-block;margin-bottom:10px;font-weight:700}
.konu-bas{margin-bottom:14px}
.konu-bas h1 .unite-no{font-size:.95rem;vertical-align:middle;margin-right:10px}
.sekmeler{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;margin-bottom:16px;scrollbar-width:thin}
.sekmeler button{flex:none;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);min-height:44px}
.sekmeler button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.kart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.defter{border-left:4px solid var(--bubble);border-radius:4px 12px 12px 4px}
.grup-baslik{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:20px 0 8px}
.hata-grup{display:grid;grid-template-columns:1.2em minmax(0,1fr) 5.5em;align-items:center;gap:10px;margin:6px 0;padding:8px 10px!important;border-bottom:1px solid var(--line)!important}
.hata-grup h3{margin:0}
.hata-grup .sayi-rozet{text-align:center;justify-self:stretch}
.hata-grup,.cip{--lamba:#d97706;--lamba-isik:rgba(245,158,11,.55)}
@media (prefers-color-scheme: dark){.hata-grup,.cip{--lamba:#ffc233;--lamba-isik:rgba(255,190,40,.75)}}
:root[data-theme="dark"] .hata-grup,:root[data-theme="dark"] .cip{--lamba:#ffc233;--lamba-isik:rgba(255,190,40,.75)}
:root[data-theme="light"] .hata-grup,:root[data-theme="light"] .cip{--lamba:#d97706;--lamba-isik:rgba(245,158,11,.55)}
.hata-grup[aria-current="true"] h3{font-weight:800;color:var(--lamba);text-shadow:none}
.hata-grup[aria-current="true"] .sayi-rozet{color:var(--lamba);font-weight:800;text-shadow:none}
.hata-grup[aria-current="true"] .ok{color:var(--lamba);font-weight:800;text-shadow:0 0 6px var(--lamba-isik)}
.sayi-rozet{font-size:.8rem;font-weight:700;background:var(--surface2);border-radius:999px;padding:1px 10px}
.kod{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.etiket{font-weight:700;font-size:.86rem;color:var(--muted);display:block;margin-top:8px}
.tuyo-kutu{background:var(--hl);border-radius:8px;padding:12px 16px;margin-top:14px}
.tuyo-kutu ul{margin:6px 0 0;padding-left:20px}
.tuyo-kutu li{margin-bottom:4px}
.hata-kart{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,9fr);gap:16px;align-items:start}
.hata-sol{display:flex;flex-direction:column;gap:8px;min-width:0}
.hata-sol img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.hata-sag{min-width:0}
.hata-kutu{border-radius:8px;padding:8px 12px;margin-top:8px;font-weight:600}
.hata-kutu.dogru{background:var(--ok-bg);color:var(--ok)}
.hata-kutu.yanlis{background:var(--bad-bg);color:var(--bad)}
.hata-kutu .etiket{color:inherit;margin:0 0 2px;font-weight:700}
.hata-kutu p{margin:0}
.hata-tuyo{background:var(--hl);border-radius:8px;padding:10px 14px;margin-top:10px}
.hata-tuyo .etiket{color:inherit;margin:0 0 2px}
.hata-tuyo p{margin:0}
.hata-cozum{margin-top:10px}
.hata-cozum summary{cursor:pointer;font-weight:700;color:var(--accent)}
.hata-cozum ol{margin:6px 0 0;padding-left:22px}
.hata-cozum li{margin-bottom:4px}
@media (max-width:760px){.hata-kart{grid-template-columns:minmax(0,1fr)}}
.veli-not{background:var(--hl);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.veli-not strong{font-family:var(--f-baslik)}

/* sorular ve optik şıklar */
.soru-kart{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.soru-ust{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
.soru-metin{font-size:1.05rem;margin-bottom:12px}
.siklar{display:grid;gap:8px}
.sik{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:48px}
.sik:hover{border-color:var(--accent)}
.sik-metin{flex:1;min-width:0;padding-top:3px;overflow-wrap:anywhere;white-space:pre-line}
.balon{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--bubble);display:grid;place-items:center;font-family:var(--f-baslik);font-weight:700;font-size:.9rem}
.sik[aria-pressed="true"] .balon{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sik.dogru{border-color:var(--ok);background:var(--ok-bg)}
.sik.dogru .balon{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.sik.yanlis{border-color:var(--bad);background:var(--bad-bg)}
.sik.yanlis .balon{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.sik-isaret{font-size:.78rem;font-weight:700;padding-top:6px;white-space:nowrap}
.geri-bildirim{margin-top:12px;border-radius:10px;padding:10px 14px;border:1.5px solid var(--line);background:var(--surface2)}
.geri-bildirim.ok{border-color:var(--ok);background:var(--ok-bg)}
.geri-bildirim.hata{border-color:var(--bad);background:var(--bad-bg)}
.geri-bildirim strong{display:block;font-family:var(--f-baslik)}
.cipler{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;min-height:38px}
.cip[aria-pressed="true"]{background:var(--surface);border-color:var(--lamba);color:var(--lamba);font-weight:800;box-shadow:0 0 8px var(--lamba-isik)}

/* sınav */
.sinav-ust{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sayac{font-family:var(--f-baslik);font-weight:700;font-size:1.2rem}
.sayac.az{color:var(--bad)}
.optik{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:14px 0}
.no{width:40px;height:40px;border-radius:50%;border:2px solid var(--bubble);background:transparent;cursor:pointer;font-family:var(--f-baslik);font-weight:700;font-size:.85rem;justify-self:center}
.no.dolu{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.no.su{outline:3px solid var(--fg);outline-offset:2px}
.onay{background:var(--hl);border-radius:10px;padding:12px 14px;margin-top:12px}
.secenek-satir{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px 0}
.kaydir{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--muted)}
.sonuc-yanlis{border-left:4px solid var(--bad);border-radius:4px 12px 12px 4px}
.cevap-satir{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0;font-size:.95rem}

/* veli paneli */
.etkinlik{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.etkinlik .ust-satir{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.etiket-veli{background:var(--hl);border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:700}
.vk-satir{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:4px 10px 10px 4px;padding:10px 12px;cursor:pointer}
.vk-satir[aria-expanded="true"]{border-color:var(--c)}
.vk-satir .sol{min-width:0}
.vk-satir .sol strong{display:block;overflow-wrap:anywhere}
.mini{width:110px;height:30px}
.mini rect{fill:var(--accent)}
.mini line{stroke:var(--line);stroke-width:1}
.vk-detay{background:var(--surface);border:1.5px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:14px 16px;margin:-2px 0 12px}
.vk-detay h3{margin:18px 0 8px}
.vk-detay h3:first-child{margin-top:0}
.cubuk-satir{display:grid;grid-template-columns:minmax(80px,1.2fr) 2fr auto;gap:8px;align-items:center;margin:6px 0;font-size:.92rem}
.cubuk{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.cubuk i{display:block;height:100%;background:var(--accent)}
.cubuk.zayif i{background:var(--bad)}
.oneri{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.oneri input{margin-top:5px;width:18px;height:18px;flex:none}
.oneri label{flex:1;min-width:0;overflow-wrap:anywhere}
.alan{display:block;width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
textarea.alan{min-height:90px;resize:vertical}
.form-satir{display:grid;gap:4px;margin:10px 0}
.form-satir label{font-weight:700;font-size:.9rem}
.yatay{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

@media (max-width:480px){
  body{font-size:16px}
  .cubuk-satir{grid-template-columns:1fr auto}
  .cubuk-satir .cubuk{grid-column:1 / -1;order:3}
}
@media (prefers-reduced-motion: reduce){

function soruSec(konuId, n) {

/* ============ Alıştırma ============ */
function soruAltKonu(konuId, q) {
  const ha = S.sira[konuId]?.sorular?.[q.altKonu];
  const sira = altKonuSirasiId(konuId);
  return ha && sira.includes(ha) ? ha : (q.altKonu || "Genel");
}
// Alıştırma çipleri: önce hata alt konusu sırası (sorusu olanlar), sonra eşlenmemiş gruplar
function alisAltKonular(konuId, liste) {
  const var_ = new Set(liste.map((q) => soruAltKonu(konuId, q)));
  const sira = altKonuSirasiId(konuId).filter((ad) => var_.has(ad));
  const kalan = [];
  for (const q of liste) { const ad = soruAltKonu(konuId, q); if (!sira.includes(ad) && !kalan.includes(ad)) kalan.push(ad); }
  return [...sira, ...kalan];
}
function alisBaslat(konuId) {
  const b = S.banka[konuId];
  const sr = soruSonuclari(S.grup.get(konuId) || [], b.harita);
  const havuz = b.liste.filter((q) => !S.alisFiltre || soruAltKonu(konuId, q) === S.alisFiltre);
  const bloklar = new Map(); // hata alt konusu -> sorular (filtresizken alt konu sırasıyla)
  if (S.alisFiltre) bloklar.set(S.alisFiltre, havuz);
  else {
    const sira = alisAltKonular(konuId, b.liste);
    for (const ad of sira) bloklar.set(ad, []);
    for (const q of havuz) bloklar.get(soruAltKonu(konuId, q)).push(q);
  }
  const kuyruk = [];
  for (const blok of bloklar.values()) {
    const y = [], n = [], r = [];
    for (const q of blok) { const x = sr.get(q.id); if (!x) n.push(q.id); else if (x.son !== "d") y.push(q.id); else r.push(q.id); }
    kuyruk.push(...karistir(y), ...karistir(n), ...karistir(r));
  }
  S.alis = { konuId, altKonu: S.alisFiltre, kuyruk, i: 0, cevaplar: {},
    baslangic: new Date().toISOString(), t0: Date.now(), bitti: false };
}
function alisSatir(konuId, ad) {
  const a = S.alis;
  if (a && !a.bitti && Object.values(a.cevaplar).some((x) => x != null)) alisBitir(true);
  const yeni = !a;
  S.alis = null; S.alisFiltre = ad;
  if (yeni) ilerle(() => alisBaslat(konuId), "alis"); else { alisBaslat(konuId); render(); }
}
function alisCevap(L) {
  const a = S.alis; const id = a.kuyruk[a.i];
  if (a.cevaplar[id] != null) return;
  a.cevaplar[id] = L; render();
}
function alisKapat() {
  const a = S.alis;
  if (a && !a.bitti && Object.values(a.cevaplar).some((x) => x != null)) alisBitir(true);
  S.alis = null;
}
function alisSecimeDon() { geriAl("alis", alisKapat); }
function alisBitir(sessiz) {
  const a = S.alis; if (!a || a.bitti) return;
  a.bitti = true;
  const ids = a.kuyruk.filter((id) => a.cevaplar[id] != null);
  if (ids.length) {
    denemeKaydet(a, denemeKaydi(a.konuId, "alistirma", null, ids, a.cevaplar, (Date.now() - a.t0) / 1000, a.baslangic));
  }
  if (sessiz) S.alis = null; else render();

  S.yaziyor[anahtar] = true; render();
  let tamam = false;
  try {
    if (!S.db) throw { code: "not_granted" };
    await islem(); tamam = true;
    if (okMesaj) S.bildirim = { tur: "ok", metin: okMesaj };
  } catch (e) { S.bildirim = { tur: "hata", metin: hataMesaji(e, "Kaydedilemedi") }; }
  S.yaziyor[anahtar] = false;

  render(); return tamam;
}

  yaz("ayar", () => S.db.doc("ayarlar/genel").set({ ...S.ayar, lgsTarihi: v }), "LGS tarihi kaydedildi.")
    .then((ok) => { if (ok) S.veli.lgsTaslak = null; render(); });

function oneriHesapla(k) {
  const b = S.banka[k.id]; if (!b || b.durum !== "hazir") return null;
  const dl = S.grup.get(k.id) || [];
  const sr = soruSonuclari(dl, b.harita);
  const yanlislar = [...sr.entries()].filter(([, r]) => r.son !== "d")
    .sort((x, y) => (y[1].yanlis + y[1].bos) - (x[1].yanlis + x[1].bos)).map((e) => e[0]);
  const ak = altKonuIst(dl, b.harita);

    .sort((x, y) => x[1].dogru / x[1].top - y[1].dogru / y[1].top).slice(0, 3).map((e) => e[0]);
  const gorulmemis = b.liste.filter((q) => !sr.has(q.id) && zayif.includes(q.altKonu)).map((q) => q.id);
  return [...yanlislar, ...gorulmemis].slice(0, 40);

function rotaOku() {

  if (x.startsWith("konu-")) return { ad: "konu", id: x.slice(5) };

let sonHash = location.hash;

function gezinti(e) {

}

async function basla(veri) {

  if (veri.sinav) { S.sinav = { ...veri.sinav, baslMs: Date.now() }; if (!S.sinav.bitti) sayacBaslat(); }
