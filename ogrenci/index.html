<title>Duru'nun Çalışma Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
/*
  TASARIM PLANI
  Konu: LGS'ye hazırlanan 8. sınıf öğrencisinin çalışma masası.
  Kimlik: "optik form + ders defteri". Serin mavimsi kâğıt zemin, lacivert mürekkep metin,
  mürekkep mavisi vurgu. Şıklar optik formdaki gibi somon çizgili yuvarlak baloncuklar
  (seçilince dolar). Tüyolar fosforlu kalem sarısı. Her dersin bir renk etiketi var.
  Çekirdek renkler: --bg, --surface, --fg, --accent, --hl, --bubble. Gerisi bunlardan türeyen
  yardımcı tonlar (çizgi, soluk metin, doğru/yanlış, ders etiketleri).
  Fontlar: başlık Bricolage Grotesque, gövde Atkinson Hyperlegible.
*/
:root{
  --bg:#f2f6fc; --surface:#ffffff; --fg:#12203f; --accent:#2343b5; --hl:#fff27a; --bubble:#d9645a;
  --surface2:#e8eef9; --muted:#4f5d7a; --line:#cdd7ea; --on-accent:#ffffff;
  --ok:#17734a; --ok-bg:#dff3e8; --bad:#b0281f; --bad-bg:#fbe3e0;
  --c-tr:#d32f2f; --c-mat:#1e5bd8; --c-fen:#188036; --c-ink:#b45f00; --c-din:#7c3aed; --c-ing:#d0267a; --c-diger:#5b6784;
  --t-tr:#fbecec; --t-mat:#ebf0fb; --t-fen:#eaf4ed; --t-ink:#f8f1e8; --t-din:#f3edfd; --t-ing:#fbebf3; --t-diger:#f0f1f4;
  --k-odev:#d99a00;
  --f-baslik:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-govde:"Atkinson Hyperlegible","Segoe UI",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
/* Temalar: yalnız Duru'nun panelinde (render() <html data-tema> koyar; veli panelinde nitelik yok → yukarıdaki sade açık renkler) */
:root[data-tema="lavanta"]{--bg:#f5f0fc; --surface:#ffffff; --fg:#2a1f45; --accent:#94408f; --hl:#ffe680; --on-accent:#ffffff; --surface2:#ece2fb; --line:#e0d5f3; --muted:#5d4f7e}
:root[data-tema="seftali"]{--bg:#fff5ee; --surface:#ffffff; --fg:#3a2219; --accent:#b04528; --hl:#ffe27a; --on-accent:#ffffff; --surface2:#ffe2d6; --line:#f6d9cb; --muted:#6b4f43}
:root[data-tema="deniz"]{--bg:#ecf7f7; --surface:#ffffff; --fg:#12343b; --accent:#0b6b7c; --hl:#fff08a; --on-accent:#ffffff; --surface2:#d3eff1; --line:#cde6e8; --muted:#3e5f66}
:root[data-tema] .marka-bal i{border-color:var(--accent)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-govde);font-size:17px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-baslik);font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
h1{font-size:clamp(1.7rem,6vw,2.4rem)} h2{font-size:1.3rem} h3{font-size:1.08rem} h4{font-size:1rem}
p{margin:0 0 .6em} a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kabuk{min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.ic{max-width:940px;margin:0 auto}
.metin{white-space:pre-line;overflow-wrap:anywhere}
.soluk-yazi{color:var(--muted)}
.kucuk{font-size:.88rem}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* üst şerit */
.ust{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:18px}
.marka{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--f-baslik);font-weight:700;font-size:1.05rem}
.marka-bal{display:inline-flex;gap:3px}
.marka-bal i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bubble);display:block}
.marka-bal i:nth-child(2){background:var(--accent);border-color:var(--accent)}
.ana-sekme{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.ana-sekme a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--fg);font-weight:700;font-size:.92rem}
.ana-sekme a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.ana-sekme a.veli-sekme[aria-current="page"]{background:#d97706;color:#fff}
.vk-bolum{border-top:1.5px solid var(--line);border-radius:12px;margin:0 0 12px}
.vk-kart .mini{width:100%;margin-top:6px}

/* bildirim */
.bildirim{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:14px;border:1.5px solid var(--line);background:var(--surface)}
.bildirim.ok{border-color:var(--ok);background:var(--ok-bg)} .bildirim.hata{border-color:var(--bad);background:var(--bad-bg)}
.bildirim button{background:none;border:0;cursor:pointer;font-size:1.2rem;line-height:1;padding:2px 6px;color:var(--fg)}

/* kahraman ve sayaçlar */
.kahraman{margin-bottom:22px}
.kahraman h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 4px;margin:0 -4px}
.karolar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.karo{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px}
.karo b{display:block;font-family:var(--f-baslik);font-size:1.9rem;line-height:1.1}
.karo span{font-size:.88rem;color:var(--muted)}

.bolum{margin-top:28px}
.bolum>h2{margin-bottom:10px}
.bos-durum{border:2px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.bos-durum strong{display:block;color:var(--fg);font-family:var(--f-baslik);font-size:1.1rem;margin-bottom:4px}
.iskelet{display:grid;gap:10px;margin-top:10px}
.iskelet i{display:block;height:84px;border-radius:12px;background:var(--surface2);animation:nefes 1.4s ease-in-out infinite}
@keyframes nefes{50%{opacity:.5}}

/* ders etiketleri */
.d-tr{--c:var(--c-tr);--t:var(--t-tr)} .d-mat{--c:var(--c-mat);--t:var(--t-mat)} .d-fen{--c:var(--c-fen);--t:var(--t-fen)} .d-ink{--c:var(--c-ink);--t:var(--t-ink)} .d-din{--c:var(--c-din);--t:var(--t-din)} .d-ing{--c:var(--c-ing);--t:var(--t-ing)} .d-diger{--c:var(--c-diger);--t:var(--t-diger)}
.ders-chip{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--c);color:#fff;border:1px solid var(--c)}
.ders-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.ders-baslik{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding-left:10px;border-left:6px solid var(--c)}
.ders-izgara{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.ders-izgara{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ders-izgara .bos-yer{visibility:hidden}
.ders-kart{display:flex;flex-direction:column;gap:6px;height:100%;min-height:110px;box-sizing:border-box;text-decoration:none;color:var(--fg);background:var(--t);border:1.5px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:12px 16px 14px}
.ders-kart:hover{border-color:var(--c);box-shadow:0 3px 0 -1px color-mix(in srgb,var(--c) 40%,transparent)}
.ders-kart h3{font-size:1.15rem}
.ders-ust{display:block;width:100%;box-sizing:border-box;background:var(--c);border:2px solid var(--c);border-radius:14px;padding:14px 20px;margin:6px 0 16px;box-shadow:0 3px 0 -1px color-mix(in srgb,var(--c) 45%,transparent)}
.ders-ust h2{margin:0;color:var(--surface);font-size:1.6rem;font-weight:800;letter-spacing:.01em}
.konu-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.konu-kart{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:4px 14px 14px 4px;padding:12px 14px;min-width:0}
.konu-kart:hover{border-color:var(--c);box-shadow:0 3px 0 -1px color-mix(in srgb,var(--c) 40%,transparent)}
.konu-kart.soluk{opacity:.62}
.konu-kart h3{font-size:.97rem}
.unite-no{margin-right:8px;font-size:1em;font-weight:700;color:var(--muted);white-space:nowrap}
.konu-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;color:var(--muted)}
.ilerleme{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.ilerleme i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ilerleme.ilerleme-ky{background:#8e1b13}
.ilerleme.ilerleme-ky i{background:var(--ok);border-radius:0}
.ilerleme.ilerleme-koc{background:var(--surface2,#e6e8ef)}
.ilerleme.ilerleme-koc i{background:var(--accent)}
.rozet{display:inline-block;align-self:flex-start;padding:1px 10px;border-radius:6px;font-size:.78rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface2)}
.rozet.tekrar{background:var(--hl);border-color:transparent;color:var(--fg)}
.rozet.tamam{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.rozet.calisiyor{border-color:var(--accent);color:var(--accent);background:transparent}
.rozet.yazi-rozet{background:transparent!important;border-color:transparent!important;padding-left:0;font-weight:800;font-size:.85rem}
.rozet.baslanmadi{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.rozet.eksik{border-color:#c2410c;color:#c2410c;background:#ffedd5}

/* ödev kartı */
.odev{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.odev>div{min-width:0;flex:1 1 220px}
.not-kutu{background:var(--hl);padding:6px 10px;border-radius:6px;margin-top:6px;font-size:.92rem}

/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ikincil{background:var(--surface);color:var(--fg);border-color:color-mix(in srgb,var(--fg) 38%,var(--surface))}
.btn.ikincil:hover:not([disabled]){background:var(--surface2)}
.btn.tehlike{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.kucuk{min-height:36px;padding:4px 12px;font-size:.9rem}
.satir{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* banner */
.serit{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;background:var(--hl);border-radius:10px;padding:10px 14px;margin-bottom:16px}

/* konu sayfası */
.geri{display:inline-block;margin-bottom:10px;font-weight:700}
.ders-ust-link{text-decoration:none}
.ders-ust-link h2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ders-ust-link .geri-ok{font-size:.95rem;font-weight:700;white-space:nowrap;opacity:.95}
.ders-ust-link:hover h2{text-decoration:underline}
.konu-bas{margin-bottom:14px}
.konu-bas h1{font-size:clamp(1.35rem,4.5vw,1.8rem)}
.konu-bas h1 .unite-no{font-size:.88em;margin-right:10px}
.sekmeler{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;overflow-y:hidden;margin-bottom:16px;scrollbar-width:thin}
.sekmeler button{flex:none;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);min-height:44px}
.sekmeler button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.panel-sekme{display:flex;gap:6px;border-bottom:2px solid var(--line);overflow-x:auto;overflow-y:hidden;margin:0 0 18px;scrollbar-width:thin}
.panel-sekme a{flex:1 0 auto;text-align:center;text-decoration:none;color:var(--muted);font-weight:800;font-size:1.1rem;padding:12px 22px;min-height:44px;box-sizing:border-box;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.panel-sekme a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.panel-sekme.veli a[aria-current="page"]{border-bottom-color:#d97706}
.selam{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.selam h1{margin:0;font-size:1.5rem;white-space:nowrap}
.selam h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 4px;margin:0 -4px}
.selam .tema-ac{margin-left:auto}
.tema-dugme{font:inherit;font-size:.85rem;font-weight:700;padding:4px 12px;min-height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tema-dugme[aria-expanded="true"]{border-color:var(--accent)}
.tema-secenek{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin:2px 0 0}
.tema-sec{font:inherit;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 6px;min-height:36px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tema-sec i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.tema-sec[aria-pressed="true"]{border-color:var(--accent)}
.tema-sec[aria-pressed="true"]::after{content:"✓";color:var(--accent);font-weight:800}
.seri-rozet{display:inline-block;font-size:.85rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--fg);border:1.5px solid var(--accent)}
.seri-rozet.kucuk-seri{font-size:.72rem;padding:0 8px;margin-left:8px;vertical-align:middle}
.gunluk-soz{font-style:italic;color:var(--muted);margin:-6px 0 14px}
.konfeti-kat{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.konfeti{position:absolute;width:8px;height:12px;border-radius:2px;animation:konfeti-dus 1.6s ease-in forwards}
@keyframes konfeti-dus{to{transform:translateY(420px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.konfeti-kat{display:none}}
.prog-don{display:inline-block;margin:0 0 12px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--accent);font-weight:800;text-decoration:none;color:var(--fg);background:var(--surface)}
.kart{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.defter{border-left:4px solid var(--bubble);border-radius:4px 12px 12px 4px}
.grup-baslik{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:20px 0 8px}
.hata-grup{display:grid;grid-template-columns:1.2em minmax(0,1fr) 5.5em;align-items:center;gap:10px;margin:6px 0;padding:8px 10px!important;border-bottom:1px solid var(--line)!important}
.hata-grup h3{margin:0}
.hata-grup.acilir{grid-template-columns:1.2em minmax(0,1fr) 5.5em 1.2em}
.hata-grup.acilir .sayi-rozet.rozet-tamam{color:var(--ok);font-weight:800}
.hata-grup.acilir .sayi-rozet.rozet-eksik{color:var(--bad);font-weight:800}
.yeni-uyari{margin:6px 0 4px;font-size:.88rem;font-weight:800;color:var(--bad);line-height:1.35}
.ac-ok{color:var(--muted);text-align:center;font-size:1rem}
.hata-grup[aria-expanded="true"] .ac-ok{color:var(--lamba)}
.hata-grup .sayi-rozet{text-align:center;justify-self:stretch}
.hata-grup,.cip,.lamba-yazi{--lamba:var(--c,#d97706);--lamba-isik:color-mix(in srgb,var(--lamba) 45%,transparent)}
.lamba-yazi{color:var(--lamba)!important;font-weight:800}
.btn.lamba-yazi{border-color:var(--lamba)}
.adim-baslik{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:2px 0 10px}
.adim-baslik h3{font-size:1.3rem}
.adim-baslik span{font-size:.9rem;color:var(--muted);font-weight:600}
.satir-ici{margin:4px 0 14px;padding:12px 0 4px 14px;border-left:3px solid #d97706}
:root[data-tema] .satir-ici{border-left-color:var(--c,var(--accent))}
.konu-satirlari .grup-baslik{scroll-margin-top:12px}
.geri-satir{display:flex;justify-content:flex-end;margin:0 0 8px}
.hata-grup[aria-current="true"] h3{font-weight:800;color:var(--lamba);text-shadow:none}
.hata-grup[aria-current="true"] .sayi-rozet{color:var(--lamba);font-weight:800;text-shadow:none}
.hata-grup[aria-current="true"] .ok{color:var(--lamba);font-weight:800;text-shadow:0 0 6px var(--lamba-isik)}
.sayi-rozet{font-size:.8rem;font-weight:700;background:var(--surface2);border-radius:999px;padding:1px 10px}
.kod{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.etiket{font-weight:700;font-size:.86rem;color:var(--muted);display:block;margin-top:8px}
.tuyo-kutu{background:var(--hl);border-radius:8px;padding:12px 16px;margin-top:14px}
.tuyo-kutu ul{margin:6px 0 0;padding-left:20px}
.tuyo-kutu li{margin-bottom:4px}
.hata-kart{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.hata-sol{display:flex;flex-direction:column;gap:8px;min-width:0}
.hata-sol img{display:block;width:100%;max-width:1072px;margin:0 auto;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.hata-sag{min-width:0;border-top:1.5px dashed var(--line);padding-top:10px}
.hata-kutu{border-radius:8px;padding:8px 12px;margin-top:8px;font-weight:600}
.hata-kutu.dogru{background:var(--ok-bg);color:var(--ok)}
.hata-kutu.yanlis{background:var(--bad-bg);color:var(--bad)}
.hata-kutu .etiket{color:inherit;margin:0 0 2px;font-weight:700}
.hata-kutu p{margin:0}
.hata-tuyo{background:var(--hl);border-radius:8px;padding:10px 14px;margin-top:10px}
.hata-tuyo .etiket{color:inherit;margin:0 0 2px}
.hata-tuyo p{margin:0}
.hata-cozum{margin-top:10px}
.hata-cozum summary{cursor:pointer;font-weight:700;color:var(--c,var(--accent))}
.hata-cozum ol{margin:6px 0 0;padding-left:22px}
.hata-cozum li{margin-bottom:4px}
@media (max-width:760px){.hata-kart{grid-template-columns:minmax(0,1fr)}}
.veli-not{background:var(--hl);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.veli-not strong{font-family:var(--f-baslik)}

/* sorular ve optik şıklar */
.soru-kart{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.soru-ust{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.88rem;color:var(--muted)}
.soru-metin{font-size:1.05rem;margin-bottom:12px}
.siklar{display:grid;gap:8px}
.sik{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:48px}
.sik:hover{border-color:var(--accent)}
.sik-metin{flex:1;min-width:0;padding-top:3px;overflow-wrap:anywhere;white-space:pre-line}
.balon{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--bubble);display:grid;place-items:center;font-family:var(--f-baslik);font-weight:700;font-size:.9rem}
.sik[aria-pressed="true"] .balon{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sik.dogru{border-color:var(--ok);background:var(--ok-bg)}

function soruSonuclari(denemeler, harita) {
  const m = new Map(); // denemeler yeniden eskiye: ilk görülen en son sonuçtur
  for (const d of denemeler) {
    for (const id of d.soruIds || []) {
      const q = harita[id]; if (!q) continue;
      const c = (d.cevaplar || {})[id] || null;
      const durum = c == null ? "b" : (c === q.dogru ? "d" : "y");
      let r = m.get(id);
      if (!r) { r = { gor: 0, dogru: 0, yanlis: 0, bos: 0, son: durum, yanitlar: new Set() }; m.set(id, r); }
      r.gor++;
      if (durum === "d") r.dogru++; else if (durum === "y") { r.yanlis++; r.yanitlar.add(c); } else r.bos++;
    }
  }
  return m;
}
function altKonuIst(denemeler, harita) {
  const m = new Map();
  for (const d of denemeler) {
    for (const id of d.soruIds || []) {
      const q = harita[id]; if (!q) continue;
      const ak = q.altKonu || "Genel";
      const r = m.get(ak) || { top: 0, dogru: 0 }; m.set(ak, r);
      r.top++; if (((d.cevaplar || {})[id] || null) === q.dogru) r.dogru++;
    }
  }
  return m;
}
function hesapla(s, harita) {
  let dogru = 0, yanlis = 0, bos = 0, belirsiz = false;
  const ak = new Map(); const yanlislar = [];
  for (const id of s.soruIds) {
    const q = harita[id]; if (!q) continue;
    const c = s.cevaplar[id] || null;
    const a = ak.get(q.altKonu || "Genel") || { top: 0, d: 0, y: 0, b: 0 }; ak.set(q.altKonu || "Genel", a);
    a.top++;
    if (c == null) { bos++; a.b++; yanlislar.push({ q, c }); }
    else if (c === q.dogru) { dogru++; a.d++; }
    else { yanlis++; a.y++; yanlislar.push({ q, c }); }
    if (q.emin === false && c != null) belirsiz = true;

}

function soruAltKonu(konuId, q) {
  const ha = S.sira[konuId]?.sorular?.[q.altKonu];

// Alıştırma çipleri: önce hata alt konusu sırası (sorusu olanlar), sonra eşlenmemiş gruplar
function alisAltKonular(konuId, liste) {
  const var_ = new Set(liste.map((q) => soruAltKonu(konuId, q)));
  const sira = altKonuSirasiId(konuId).filter((ad) => var_.has(ad));
  const kalan = [];
  for (const q of liste) { const ad = soruAltKonu(konuId, q); if (!sira.includes(ad) && !kalan.includes(ad)) kalan.push(ad); }
  return [...sira, ...kalan];
}
const YANLIS_ID = "#yanlis";
// Duru'nun en son sonucu yanlış ya da boş olan sorusu (hiç çözülmemiş soru sayılmaz)
function yanlisMi(sr, q) { const x = sr.get(q.id); return !!x && x.son !== "d"; }
function yanlisSayisi(k) {
  const b = S.banka[k.id]; if (!b || b.durum !== "hazir") return 0;
  const sr = soruSonuclari(S.grup.get(k.id) || [], b.harita);
  return b.liste.filter((q) => yanlisMi(sr, q)).length;
}
function alisBaslat(konuId) {
  const b = S.banka[konuId];
  const sr = soruSonuclari(S.grup.get(konuId) || [], b.harita);
  const yanlis = S.alisFiltre === YANLIS_ID;
  const havuz = b.liste.filter((q) => yanlis ? yanlisMi(sr, q) : (!S.alisFiltre || soruAltKonu(konuId, q) === S.alisFiltre));
  const bloklar = new Map(); // hata alt konusu -> sorular (filtresizken alt konu sırasıyla)
  if (S.alisFiltre) bloklar.set(S.alisFiltre, havuz);
  else {
    const sira = alisAltKonular(konuId, b.liste);
    for (const ad of sira) bloklar.set(ad, []);
    for (const q of havuz) bloklar.get(soruAltKonu(konuId, q)).push(q);
  }
  const kuyruk = [];
  for (const blok of bloklar.values()) {
    const y = [], n = [], r = [];
    for (const q of blok) { const x = sr.get(q.id); if (!x) n.push(q.id); else if (x.son !== "d") y.push(q.id); else r.push(q.id); }
    kuyruk.push(...karistir(y), ...karistir(n), ...karistir(r));

/* ----- ana simülasyon ----- */
// opts: { dondur:false → bugünün dondurulmuş planını kullanma; tutulan:[Gorev] → yeniden kurarken aynen kalan görevler }
function planSimule(basStr, gunSayisi, opts) {
  gunSayisi = gunSayisi || 14; opts = opts || {};
  const ayar = planAyar(); const bugun = bugunStr(); basStr = basStr || bugun; const bas0 = tarihCoz(basStr);
  const memo = new Map();
  const bilgi = (ds) => {
    let b = memo.get(ds);
    if (!b) { b = gunBilgi(tarihCoz(ds), ayar, ds === basStr && opts.tutulan ? opts.tutulan.map((g) => ({ tarih: ds, bas: g.bas, bit: g.bit })) : []); memo.set(ds, b); }
    return b;
  };
  const havuz = planIsleri(bugun);
  const yerlesti = new Set(); const sonYanlis = new Map(); const raporlandi = new Set();
  const koclar = S.program.koc.filter((k) => +k.soruAdet > 0 && tarihCoz(k.teslim)).slice().sort((a, b) => String(a.teslim).localeCompare(String(b.teslim)));
  const kocKalan = new Map(koclar.map((k) => [k.id, Math.max(0, +k.soruAdet - kocCozulen(k.id))]));
  const kocTuket = (g) => { if (g.kocId && kocKalan.has(g.kocId)) kocKalan.set(g.kocId, Math.max(0, kocKalan.get(g.kocId) - (+g.soruAdet || 0))); };
  for (const it of havuz) { // pencere sınırları
    if (it.cls === 3) {
      const T = it.teslim; let al = [];
      if (T > basStr) { const aday = []; for (let n = 0; n < 15; n++) { const s = tarihStr(ekleGun(bas0, n)); if (s >= T) break; if (bilgi(s).kap > 0) aday.push(s); } al = aday.slice(-2); }
      it.allowed = new Set(al.length ? al : [basStr]);
    }
    if (it.allowed && [...it.allowed].sort().pop() < basStr) yerlesti.add(it.anahtar);
  }
  const yanlisAday = S.konular.filter((k) => k.durum !== "tamamlandi" && yanlisSayisi(k) > 0).sort((a, b) => yanlisSayisi(b) - yanlisSayisi(a));
  const kaynaklar = S.program.kaynak.filter((k) => k.aktif !== false).slice().sort((a, b) => String(a.olusturma || a.id).localeCompare(String(b.olusturma || b.id)));
  const donuk = basStr === bugun && opts.dondur !== false ? S.gunPlanlar.get(bugun) : null;
  const sonuc = [];
  for (let i = 0; i < gunSayisi; i++) {
    const d = ekleGun(bas0, i), ds = tarihStr(d); const bl = bilgi(ds);
    const yetismeyen = []; let gorevler; let used = 0; let sayac = 0;
    const koy = (alan) => {
      if (used >= bl.kap) return null;
      const [b, e] = bl.slots[used++];
      const g = temizObj({ gid: ds + "-" + (++sayac), bas: dkYaz(b), bit: dkYaz(e), ...alan });
      gorevler.push(g); return g;
    };
    const sabitIsle = (g, ilkGun) => {
      const aktif = !ilkGun || ["simdi", "sirada"].includes(gorevDurum(g, ds));
      if (aktif) { kocTuket(g); yerlesti.add(gorevAnahtari(g)); }
    };
    if (i === 0 && donuk) {
      gorevler = (donuk.gorevler || []).map((g) => ({ ...g })).sort((a, b) => a.bas.localeCompare(b.bas));
      for (const g of gorevler) { const du = gorevDurum(g, ds); if (du === "simdi" || du === "sirada") kocTuket(g); if (du !== "ertelendi") yerlesti.add(gorevAnahtari(g)); }
    } else {
      gorevler = [...(i === 0 && opts.tutulan ? opts.tutulan.map((g) => ({ ...g })) : []), ...bl.sabit];
      if (i === 0 && opts.tutulan) for (const g of opts.tutulan) yerlesti.add(gorevAnahtari(g));
      for (const g of bl.sabit) sabitIsle(g, i === 0);
      // 1) sınav hazırlığı ve 3) okul ödevi: pencereli işler
      const pencereli = (cls) => {
        for (const it of havuz.filter((x) => x.cls === cls)) {
          if (yerlesti.has(it.anahtar)) continue;
          const son = [...it.allowed].sort().pop();
          if (it.allowed.has(ds)) {
            const g = koy({ tip: it.tip, baslik: it.baslik, ders: it.ders || "", neden: it.neden, konuId: it.konuId, odevId: it.odevId, olayId: it.olayId });
            if (g) { yerlesti.add(it.anahtar); if (it.tip === "yanlislar") sonYanlis.set(it.konuId, ds); continue; }
          }
          if (ds >= son) { yerlesti.add(it.anahtar); if (!it.opsiyonel) yetismeyen.push({ baslik: it.baslik, neden: "Zamanında yerleştirilemedi (" + it.neden + ")" }); }
        }
      };
      pencereli(1);
      // 2) koç ödevleri
      for (const kc of koclar) {
        let kalan = kocKalan.get(kc.id); if (!(kalan > 0)) continue;
        const bsl = kc.baslangic || "";
        if (ds < bsl) continue;
        if (ds > kc.teslim && i > 0) { if (!raporlandi.has(kc.id)) { raporlandi.add(kc.id); yetismeyen.push({ baslik: kocBaslik(kc), neden: "Koç ödevi teslimi geçti: " + kalan + " soru açık" }); } continue; }
        let kg = 0, topKap = 0;
        if (kc.teslim <= ds) { kg = 1; topKap = bl.kap; }
        else for (let n = 0; n <= 120; n++) { const s = tarihStr(ekleGun(d, n)); if (s >= kc.teslim) break; if (s < bsl) continue; const kp = bilgi(s).kap; if (kp > 0) { kg++; topKap += kp; } }
        if (kg === 0) { kg = 1; topKap = bl.kap; }
        if (!raporlandi.has(kc.id) && topKap * ayar.soruBlok < kalan) { raporlandi.add(kc.id); yetismeyen.push({ baslik: kocBaslik(kc), neden: "Koç ödevi teslime yetişmiyor: " + kalan + " soru açık" }); }
        const pay = Math.ceil(kalan / kg); let yer = 0; const nb = Math.ceil(pay / ayar.soruBlok);
        for (let n = 0; n < nb && yer < pay && used < bl.kap; n++) {
          const adet = Math.min(ayar.soruBlok, Math.ceil((pay - yer) / (nb - n))); // payı bloklara eşit böl
          koy({ tip: "koc", baslik: kocBaslik(kc, adet), ders: kc.ders || "", neden: "Koç ödevi, teslim " + teslimMetni(kc.teslim), konuId: kc.konuId, kocId: kc.id, soruAdet: adet });
          yer += adet;
        }
        kocKalan.set(kc.id, Math.max(0, kalan - yer));
      }
      pencereli(3);
      // 4) site ödevleri
      for (const it of havuz.filter((x) => x.cls === 4)) {
        if (yerlesti.has(it.anahtar)) continue;
        if (koy({ tip: it.tip, baslik: it.baslik, ders: it.ders || "", neden: it.neden, konuId: it.konuId, odevId: it.odevId })) yerlesti.add(it.anahtar);
      }
      // 5) yeni içerik / eksik bölümler (günde en çok 2)
      let n5 = 0;
      for (const it of havuz.filter((x) => x.cls === 5)) {
        if (n5 >= 2 || used >= bl.kap) break;
        if (yerlesti.has(it.anahtar)) continue;
        if (koy({ tip: it.tip, baslik: it.baslik, ders: it.ders || "", neden: it.neden, konuId: it.konuId })) { yerlesti.add(it.anahtar); n5++; }
      }
      // 6) yanlışlar tekrarı (günde en çok 1, en az 3 gün arayla)
      const esik = tarihStr(ekleGun(d, -3));
      for (const k of yanlisAday) {
        if (used >= bl.kap) break;
        if (sonAlistirmaGunu(k) > esik || (sonYanlis.has(k.id) && sonYanlis.get(k.id) > esik)) continue;
        if (koy({ tip: "yanlislar", baslik: konuAdi(k.id) + " – " + IS_TIP.yanlislar, ders: k.ders || "", neden: "Yanlış yaptığın " + yanlisSayisi(k) + " soru tekrar edilsin", konuId: k.id })) { sonYanlis.set(k.id, ds); break; }
      }
      // 7) kaynak kitap (dolgu, günde en çok 1)
      if (kaynaklar.length && used < bl.kap) {
        const kn = kaynaklar[yilinGunu(d) % kaynaklar.length];
        koy({ tip: "kaynak", baslik: [kn.ders, kn.ad, ayar.soruBlok + " soru"].filter(Boolean).join(" · "), ders: kn.ders || "", neden: "Kaynak kitaptan soru çözümü", kaynakId: kn.id, soruAdet: ayar.soruBlok });
      }
      gorevler.sort((a, b) => a.bas.localeCompare(b.bas) || a.bit.localeCompare(b.bit));
    }
    const kullanilanDk = gorevler.reduce((s, g) => s + Math.max(0, dkDan(g.bit) - dkDan(g.bas)), 0);
    sonuc.push({ tarih: ds, gorevler, kapasiteDk: Math.max(bl.kapasiteDk, i === 0 && donuk ? kullanilanDk : 0), kullanilanDk, yetismeyen });
  }
  return sonuc;
}
